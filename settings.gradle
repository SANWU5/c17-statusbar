pluginManagement {
    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        google()
    }
}
// The root buildscript pins Kotlin for AGP's built-in Kotlin support.
gradle.beforeProject { project ->
    project.buildscript.repositories {
        mavenCentral()
        google()
    }
}
rootProject.name = 'ios-statusbar-module'
include ':app'
