name: Validate plugin SDK
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema
      - run: python -m unittest discover -s tests -v
      - run: python tools/pack.py standard templates/standard-runtime
      - run: python tools/pack.py build-all --out dist
      - run: python tools/pack.py catalog index.json
